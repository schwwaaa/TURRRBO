[package]
name = "turrrbo"
version = "0.1.0"
description = "TURRRBO — StyleGAN image instrument for artists"
authors = ["TURRRBO"]
license = "UNLICENSED"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "protocol-asset", "fs-copy-file",
  "shell-open",
  "dialog-open",
  "dialog-save",
  "fs-read-file",
  "fs-write-file",
  "fs-create-dir",
  "path-all",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
